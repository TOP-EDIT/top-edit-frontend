<!DOCTYPE html>
<html lang="he" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <title>TOP EDIT</title>
    <!-- ייבוא פונט מקצועי ומודרני מגוגל -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
        }
        body {
            background: #0b0b0e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .card {
            background: #141418;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            width: 450px;
            text-align: center;
            border: 1px solid #22222a;
            position: relative;
        }
        /* כפתור החלפת שפה פינתי */
        .lang-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #1f1f28;
            color: #a1a1aa;
            border: 1px solid #2d2d3a;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-btn:hover {
            background: #2d2d3a;
            color: #fff;
        }
        h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 30%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .file-drop-zone {
            background: #1a1a23;
            border: 2px dashed #323246;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 22px;
            cursor: pointer;
            transition: 0.3s;
        }
        .file-drop-zone:hover {
            border-color: #ff0050;
            background: #1f1f2e;
            box-shadow: 0 0 15px rgba(255, 0, 80, 0.15);
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            font-size: 14px;
            color: #cbd5e1;
            cursor: pointer;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        button.action-btn {
            background: linear-gradient(135deg, #ff0050, #b8003a);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(255, 0, 80, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        button.action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 80, 0.6);
        }
        button.action-btn:disabled {
            background: #1f1f28;
            color: #52525b;
            cursor: not-allowed;
            box-shadow: none;
        }
        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #a1a1aa;
            min-height: 20px;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer-social {
            margin-top: 25px;
            border-top: 1px solid #22222a;
            padding-top: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tiktok-link {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1f1f28;
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid #2d2d3a;
            transition: 0.3s;
        }
        .tiktok-link:hover {
            background: #2d2d3a;
            border-color: #ff0050;
            box-shadow: 0 0 10px rgba(255, 0, 80, 0.2);
        }
        .tiktok-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="card">
        <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">English</button>

        <h2 id="appTitle">TOP EDIT</h2>
        <p class="subtitle" id="appSubtitle">בחר קובץ וידאו לעיבוד מהיר</p>

        <div class="file-drop-zone" onclick="document.getElementById('fileInput').click();">
            <span class="file-label" id="fileLabel">לחץ לבחירת קובץ וידאו...</span>
            <input type="file" id="fileInput" accept="video/mp4">
        </div>

        <button class="action-btn" id="patchBtn" disabled>
            <span id="btnText">החל עיבוד והורד</span>
        </button>
        <div id="status">מוכן לעבודה</div>

        <div class="footer-social">
            <a href="https://www.tiktok.com/@topedit.aep" target="_blank" class="tiktok-link" id="tiktokAnchor">
                <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
                <span id="tiktokText">עקוב ב-TikTok</span>
            </a>
        </div>
    </div>

    <script>
        function openTikTok(e) {
            e.preventDefault();
            window.open('https://www.tiktok.com/@topedit.aep', '_blank');
        }

        // חיבור הכפתור בצורה בטוחה לדפדפן
        document.getElementById('tiktokAnchor').addEventListener('click', openTikTok);

        let currentLang = 'he';

        const translations = {
            he: {
                title: "TOP EDIT",
                subtitle: "בחר קובץ וידאו לעיבוד מהיר",
                defaultFile: "לחץ לבחירת קובץ וידאו...",
                btnAction: "החל עיבוד והורד",
                btnProcessing: "מעבד קובץ, אנא המתן...",
                statusReady: "מוכן לעבודה",
                statusSuccess: "ההורדה הוצלחה!",
                tiktok: "עקוב ב-TikTok",
                langBtnText: "English",
                dir: "rtl"
            },
            en: {
                title: "TOP EDIT",
                subtitle: "Select a video file for fast processing",
                defaultFile: "Click to choose a video file...",
                btnAction: "Apply & Download",
                btnProcessing: "Processing file, please wait...",
                statusReady: "Ready to work",
                statusSuccess: "Download successful!",
                tiktok: "Follow on TikTok",
                langBtnText: "עברית",
                dir: "ltr"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'he' ? 'en' : 'he';
            const t = translations[currentLang];

            document.getElementById('htmlRoot').setAttribute('dir', t.dir);
            document.getElementById('appTitle').textContent = t.title;
            document.getElementById('appSubtitle').textContent = t.subtitle;
            document.getElementById('btnText').textContent = t.btnAction;
            document.getElementById('tiktokText').textContent = t.tiktok;
            document.getElementById('langToggleBtn').textContent = t.langBtnText;
            
            if (!selectedFile) {
                document.getElementById('fileLabel').textContent = t.defaultFile;
                document.getElementById('status').textContent = t.statusReady;
            }
        }

        const fileInput = document.getElementById('fileInput');
        const patchBtn = document.getElementById('patchBtn');
        const btnText = document.getElementById('btnText');
        const statusEl = document.getElementById('status');
        const fileLabel = document.getElementById('fileLabel');
        let selectedFile = null;

        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            const t = translations[currentLang];
            if (selectedFile) {
                patchBtn.disabled = false;
                fileLabel.textContent = selectedFile.name;
                statusEl.textContent = `${currentLang === 'he' ? 'נבחר קובץ' : 'Selected'}: ${selectedFile.name}`;
            } else {
                patchBtn.disabled = true;
                fileLabel.textContent = t.defaultFile;
                statusEl.textContent = t.statusReady;
            }
        });

        patchBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            patchBtn.disabled = true;
            const t = translations[currentLang];
            
            btnText.innerHTML = `<span class="spinner"></span> ${t.btnProcessing}`;
            statusEl.textContent = t.btnProcessing;

            const formData = new FormData();
            formData.append('video', selectedFile);

            try {
                const response = await fetch('https://top-edit-backend2.onrender.com/process-video', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Error processing file');

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${selectedFile.name.replace(/\.[^/.]+$/, '')}_Top Edit.mp4`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                
                statusEl.textContent = t.statusSuccess;
            } catch (err) {
                statusEl.textContent = `Error: ${err.message}`;
            } finally {
                patchBtn.disabled = false;
                btnText.textContent = t.btnAction;
            }
        });
    </script>
</body>
</html>
